        end_date:
        location: "Philadelphia, PA, USA"
        summary:
      - institution: "Annenberg School for Communication, University of Pennsylvania"
        area: "Communication"
        degree: "Master of Arts"
        date: "2024-05"
        start_date:
        end_date:
        location: "Philadelphia, PA, USA"
        summary:
      - institution: "Universidad Panamericana"
        area: "Communication"
        degree: "Bachelor of Arts"
        date: "2018-05"
        start_date:
        end_date:
        location: "Mexico City, Mexico"
        summary:
        highlights: []
    Technical skills and Methodologies:
      - number: "Spanish: native speaker"
      - number: "English: advanced (C2)"
      - number: "French: intermediate (B2)"
      - number: "German: intermediate (B1)"
    Relevant Experience:
      - name: "Politics, Identities, and Communication Lab"
        date:
        start_date: "2025-05"
        end_date: "present"
        location: "Annenberg School for Communication, University of Pennsylvania"
        summary: "Research Fellow"
        highlights:
          - "Co-authored 'WhichTok? Comparing Three TikTok Data Acquisition Tools' (Jeon et al., 2025, under review), contributing to theoretical conceptualization, writing, reviewing, and editing."
          - "Ongoing project: 'Aligned identities, curated politics: Mapping political expression on TikTok across the ideological spectrum', contributing to theoretical conceptualization, formulation of overarching research goals, methodology design, computational visual analysis of over 5000 TikTok videos, writing, reviewing, and editing."
          - "Ongoing project: 'What do engagement metrics measure? Strategic optimization and content characteristics in AI-related content on TikTok', contributing to theoretical conceptualization, formulation of overarching research goals, methodology design, computational visual analysis of over 2000 TikTok videos, writing, reviewing, and editing."
      - name: "Introduction to Communication Behavior"
        date:
        start_date: "2026-01"
        end_date: "2026-05"
        location: "Annenberg School for Communication, University of Pennsylvania"
        summary: "Teaching Fellow"
        highlights:
          - "Provided individual assistance and clarification during dedicated office hours."
          - "Assisted the instructor with logistical tasks, such as managing the online learning platform and maintaining grade and attendance records."
          - "Graded and provided dedicated feedback for assignments and final papers."
      - name: "Center for Advanced Research in Global Communication"
        date:
        start_date: "2022-08"
        end_date: "2023-08"
        location: "Annenberg School for Communication, University of Pennsylvania"
        summary: "Research Fellow"
        highlights:
          - "Worked under Dr. Juan Llamas Rodríguez's supervision on the development of a mixed-methods study on the representation of gender and skin color stereotypes in Mexican telenovelas and TV series (a report commissioned by the Luminate foundation)."
          - "Co-authored 'Poder Prieto: Media, Colorism, and Cultural Activism in Mexico' (Llamas-Rodríguez and Téliz Martínez, 2026, in press), contributing to theoretical conceptualization, formulation of overarching research goals, writing, reviewing, and editing."
      - name: "Children and Media"
        date:
        start_date: "2024-08"
        end_date: "2024-12"
        location: "Annenberg School for Communication, University of Pennsylvania"
        summary: "Teaching Fellow"
        highlights:
          - "Provided individual assistance and clarification during dedicated office hours."
          - "Assisted the instructor with logistical tasks, such as managing the online learning platform and maintaining grade and attendance records."
          - "Graded and provided dedicated feedback for assignments and final papers."
          - "Assisted in designing and grading exams."
          - "Taught lecture on racial representations in children's media."
      - name: "DragonLab Consultants"
        date:
        start_date: "2021"
        end_date: "2022"
        location: "Mexico City, Mexico"
        summary: "Researcher"
        highlights:
          - "Participated in the research consulting project titled 'Analysis of Court Rulings with Gender Perspective'."
          - "Analyzed and coded the content of 342 court rulings to determine if Mexican judges use gender perspective adequately."
          - "Performed the statistical exploration of the data sets obtained from said content analysis."
          - "Synthesized the results from the content analysis into a report that Mexico's Judiciary will use to evaluate the nation's Protocol to Judge with Gender Perspective."
      - name: "Quantitative Methods for Communication Research"
        date:
        start_date: "2020-01"
        end_date: "2022-12"
        location: "Universidad Panamericana, Mexico City"
        summary: "Instructor of Record"
        highlights:
          - "Served as the Instructor of Record for an undergraduate-level course, delivering all lectures and directing all class activities for the Communication major."
          - |-
            Introduced the programming language R into the curriculum as the
            main tool for learning Quantitative Methods.
          - "Designed all educational materials, including original slides, assignments, tests, and lab activities."
          - "Held regular office hours for student assistance and managed the grading of all assignments, including weekly lab activities and final projects."
      - name: "Facultad Latinoamericana de Ciencias Sociales (FLACSO)"
        date:
        start_date: "2018"
        end_date: "2022"
        location: "Mexico City, Mexico"
        summary: "Research Assistant"
        highlights:
          - "Analyzed data and designed visualizations for a research project about the gap between political and economic globalization."
          - "Coordinated a research consulting project to identify the strengths and weaknesses of the evaluation system of information transparency for the National Institute of Access to Information and Personal Data Protection."
          - "Developed an academic program and created didactic content for the National School for Women of the Institutional Revolutionary Party, empowering female members through education on gender perspective, political representation, and communication strategies."
          - "Created educational content for the Migrant-e project (led by the Universidad Nacional Autónoma de México), teaching undocumented immigrants in the United States about their rights and safety tools."
    publications:
