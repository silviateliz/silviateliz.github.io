      username: "silvia-teliz"
  sections:
    Summary:
      - "I am a PhD candidate at the Annenberg School for Communication, University of Pennsylvania. I use computational social science methods to explore the visual representation of social identity in political communication. My dissertation project leverages Urban Visual Data to study how out-of-home political advertisements influence electoral outcomes in Mexican elections."
    education:
