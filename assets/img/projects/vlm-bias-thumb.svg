<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 600 260" role="img" aria-label="Abstract illustration of a grid of face outlines, one highlighted, representing a face-classification audit">
  <g fill="none" stroke="#7a7a6e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 3x2 grid of simple face outlines -->
    <g transform="translate(90,80)">
      <circle cx="0" cy="0" r="42"/>
      <circle cx="-14" cy="-8" r="3.5" fill="#7a7a6e" stroke="none"/>
      <circle cx="14" cy="-8" r="3.5" fill="#7a7a6e" stroke="none"/>
      <path d="M -14 16 Q 0 26 14 16"/>
    </g>
    <g transform="translate(230,80)">
      <circle cx="0" cy="0" r="42"/>
      <circle cx="-14" cy="-8" r="3.5" fill="#7a7a6e" stroke="none"/>
      <circle cx="14" cy="-8" r="3.5" fill="#7a7a6e" stroke="none"/>
      <path d="M -14 16 Q 0 26 14 16"/>
    </g>
    <g transform="translate(90,210)">
      <circle cx="0" cy="0" r="42"/>
      <circle cx="-14" cy="-8" r="3.5" fill="#7a7a6e" stroke="none"/>
      <circle cx="14" cy="-8" r="3.5" fill="#7a7a6e" stroke="none"/>
      <path d="M -14 16 Q 0 26 14 16"/>
    </g>

    <!-- highlighted / audited face, marker accent -->
    <g transform="translate(230,210)" stroke="#8a8c1e">
      <circle cx="0" cy="0" r="46"/>
      <circle cx="-14" cy="-8" r="3.5" fill="#8a8c1e" stroke="none"/>
      <circle cx="14" cy="-8" r="3.5" fill="#8a8c1e" stroke="none"/>
      <path d="M -14 16 Q 0 26 14 16"/>
      <rect x="-58" y="-58" width="116" height="116" rx="10" stroke-dasharray="5 6"/>
    </g>

    <!-- annotation tag pointing at the audited face -->
    <g transform="translate(340,150)" stroke="#8a8c1e">
      <path d="M0 0 L60 -10 L60 40 Z" />
      <line x1="20" y1="6" x2="45" y2="1"/>
      <line x1="20" y1="18" x2="40" y2="14"/>
    </g>

    <!-- classification labels -->
    <g transform="translate(430,60)" stroke="none" fill="#7a7a6e" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">
      <text x="0" y="0">RACE</text>
      <text x="0" y="24">GENDER</text>
    </g>
    <g transform="translate(430,220)" stroke="none" fill="#8a8c1e" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">
      <text x="0" y="0">MODEL</text>
      <text x="0" y="24">LABEL</text>
    </g>
  </g>
</svg>
